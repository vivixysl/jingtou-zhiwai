# 《镜头之外》私人 iPhone 游戏，Render Blueprint
# 服务器与磁盘均为付费资源。不要选 free，否则每次部署可能丢存档。
services:
  - type: web
    name: jingtou-zhiwai-private
    runtime: docker
    plan: 0.5c-512mb
    region: virginia
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: found-phone-world
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: CLOUD_MODE
        value: '1'
      - key: HOST
        value: '0.0.0.0'
      - key: DATA_DIR
        value: /app/data
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: GAME_PIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
