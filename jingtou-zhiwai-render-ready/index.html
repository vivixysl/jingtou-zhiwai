function chatView(){let chat=CG[S.chat];if(!chat)return wechat();const rows=filtered(chat.messages);let prev='';let html='';rows.forEach((m,i)=>{const mine=m[2]===S.owner;const stamp=m[0]!==prev||i===0|| (i>0&& Math.abs(parseInt(m[1].replace(':',''),10)-parseInt(rows[i-1][1].replace(':',''),10))>120);if(stamp)html+=`<div class="stamp">${m[0]} ${m[1]}</div>`;prev=m[0];const unique=`${S.chat}:${m[0]}:${m[1]}:${m[2]}:${i}`;const b=S.bookmarks.some(x=>x.id===unique);const isVoice=m[3].startsWith('[语音');let msg=h(m[3]);if(isVoice)msg=`🎤 ${msg} <span style="font-size:10px;opacity:.6">（模拟内容）</span>`;html+=`<div class="message-line ${mine?'own':''}">${avatar(m[2])}<div class="message-wrap">${chat.members.length>2?`<div class="sender">${h(displayName(m[2]))}</div>`:''}<div class="bubble">${msg}</div><span class="message-actions"><button class="bookmark ${b?'saved':''}" data-action="bookmark:${i}" title="收藏到手账">${b?'★':'☆'}</button></span></div></div>`});return `<section class="app-view">${bar(chatTitle(S.chat),'back:wechat','<button class="nav-icon" data-action="app:devices" aria-label="切换手机">⋯</button>')}<div class="scroll chat-bg" id="message-scroll"><div class="message-scroll">${html}</div></div><div class="compose-readonly">⌘ <div class="read-only-field">观察模式 · 仅浏览</div> ☺ <span style="font-size:21px">⊕</span></div></section>`}

function weibo(){const circle=['ding','song','he'].includes(S.owner)?['ding','song','he']:['ma','liu','zhang','yan'];const posts=POSTS.filter(p=>p.at.slice(0,5)<=nowDate()&&(circle.includes(p.by)||['media','stageMedia','street'].includes(p.by))).sort((a,b)=>b.at.localeCompare(a.at));return `<section class="app-view">${bar('微博','home','<button class="nav-icon" data-action="app:devices">⋯</button>')}<div class="weibo-tabs"><button data-action="wtab:feed" class="${S.wtab==='feed'?'active':''}">关注</button><button data-action="wtab:hot" class="${S.wtab==='hot'?'active':''}">热搜</button><button data-action="wtab:profile" class="${S.wtab==='profile'?'active':''}">我</button></div><div class="scroll">${S.wtab==='feed'?`<div class="feed-list">${posts.map(renderPost).join('')}</div>`:S.wtab==='hot'?`<div class="section-heading">${dayLong()} · 平行世界虚构热搜</div>${HOT.map(([t,flag],i)=>`<button class="hot-row" data-action="hot:${i}"><span class="hot-rank">${i+1}</span><span class="hot-title">${h(t)}</span>${flag?`<span class="small-orange">${h(flag)}</span>`:''}<span class="hot-meta">${(53-i*6).toFixed(1)}万</span></button>`).join('')}`:`<div class="weibo-head"><strong>${h(CHARACTERS[S.owner].name)}</strong><span>${h(CHARACTERS[S.owner].handle)} · 虚构账号</span><span>${h(CHARACTERS[S.owner].bio)}</span></div>${POSTS.filter(p=>p.by===S.owner&&p.at.slice(0,5)<=nowDate()).sort((a,b)=>b.at.localeCompare(a.at)).map(renderPost).join('')}`}</div></section>`}
function album(){const photos=ALBUMS[S.owner].filter(p=>p[0]<=nowDate());return `<section class="app-view">${bar('相册','home','<button class="nav-icon" data-action="app:devices">⋯</button>')}<div class="scroll"><div class="screen-card"><strong>最近项目</strong><div class="mini-meta">${h(CHARACTERS[S.owner].name)} · ${photos.length} 个占位相片 · 暂无真实人像素材</div></div><div class="album-grid">${photos.map((p,i)=>`<button class="album-item" data-action="photo:${i}" style="--ph1:${p[4]};--ph2:${p[5]}"><span>${p[2]}</span></button>`).join('')}</div></div></section>`}

function render(){const isHome=S.app==='home';$('status').className=`status ${isHome?'home-status':'app-status'}`;$('status').innerHTML=`<span>${timeNow()}</span><span class="icons">▮▮▮ ᴡɪꜰɪ ▰</span>`;$('indicator').className=`home-indicator ${isHome?'home-bottom':''}`;const routes={home,wechat,chat:chatView,weibo,albums:album,photo,notes,note,calendar,music,journal,devices};$('view').innerHTML=(routes[S.app]||home)();if(S.app==='chat'){const sc=$('message-scroll');requestAnimationFrame(()=>{if(sc)sc.scrollTop=sc.scrollHeight})}}

function handle(action){const [name,arg]=action.split(':');if(name==='advance'){advanceDay();return}if(name==='pickavatar'){pickAvatar(arg);return}if(name==='backup'){downloadBackup();return}if(name==='app'){if(arg==='wechat')S.tab='chats';if(arg==='weibo')S.wtab='feed';goto(arg);return}if(name==='home'){goto('home');return}if(name==='back'){goto(arg);return}if(name==='chat'){S.chat=arg;goto('chat');return}if(name==='tab'){S.tab=arg;S.search='';render();return}if(name==='wtab'){S.wtab=arg;render();return}if(name==='owner'){S.owner=arg;save();goto('home');return}if(name==='day'){S.day=Math.min(WORLD.maxDay,Math.max(0,Number(arg)));save();render();return}if(name==='photo'){S.imageIndex=Number(arg);goto('photo');return}if(name==='note'){S.noteIndex=Number(arg);goto('note');return}if(name==='bookmark'){
 const chat=CG[S.chat],index=Number(arg),m=filtered(chat.messages)[index];if(!m)return;const id=`${S.chat}:${m[0]}:${m[1]}:${m[2]}:${index}`;const pos=S.bookmarks.findIndex(x=>x.id===id);if(pos>=0){S.bookmarks.splice(pos,1);persistToast('已取消收藏')}else{S.bookmarks.push({id,owner:CHARACTERS[S.owner].name,date:m[0]+' '+m[1],chat:chatTitle(S.chat),sender:displayName(m[2]),text:m[3]});persistToast('已收藏到我的手账')}save();const sc=$('message-scroll'),v=sc?.scrollTop;render();if($('message-scroll'))$('message-scroll').scrollTop=v;return
 }if(name==='remove'){S.bookmarks.splice(Number(arg),1);save();render();return}if(name==='comments'){S.commentId=S.commentId===arg?'':arg;let scroll=$('view').querySelector('.scroll'),pos=scroll?.scrollTop;render();if($('view').querySelector('.scroll'))$('view').querySelector('.scroll').scrollTop=pos;return}if(name==='hot'){persistToast('虚构热搜话题 · 试玩档暂仅展示榜单');return}if(name==='track'){persistToast('试听功能留待正式版本');return}if(name==='export'){const b=new Blob([JSON.stringify({game:'镜头之外·观察档',bookmarks:S.bookmarks},null,2)],{type:'application/json'});const url=URL.createObjectURL(b);let a=document.createElement('a');a.href=url;a.download='镜头之外-我的手账.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);persistToast('手账已导出');return}}
$('view').addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)handle(el.dataset.action)});
$('view').addEventListener('input',e=>{if(e.target.dataset.input==='chat-search'){S.search=e.target.value;const old=e.target.selectionStart;const view=$('view');const sc=$('wc-scroll'),y=sc?.scrollTop||0;render();const next=view.querySelector('[data-input="chat-search"]');if(next){next.focus();next.setSelectionRange(old,old);$('wc-scroll').scrollTop=y}}});

function applyWorld(payload){
 WORLD.maxDay=Math.max(1,Number(payload.max_day)||1);
 if(!prefsHydrated){
   if(payload.user_state){const p=payload.user_state;
     if(CHARACTERS[p.owner]) S.owner=p.owner;
     if(Number.isInteger(p.day)) S.day=Math.min(WORLD.maxDay,Math.max(0,p.day));
     if(Array.isArray(p.bookmarks)) S.bookmarks=p.bookmarks;
   }
   prefsHydrated=true;
 }
 WORLD.avatars={...WORLD.avatars,...(payload.avatars||{})};
 WORLD.batches=Array.isArray(payload.generations)?payload.generations:[];
 WORLD.configured=!!payload.configured;WORLD.model=payload.model||'';
 for(const batch of WORLD.batches){
   for(const chat of batch.new_chats||[]){
     if(!CG[chat.id])CG[chat.id]={title:chat.title,members:chat.members,messages:[]};
     for(const id of chat.members) if(USER_CHAT_IDS[id]&&!USER_CHAT_IDS[id].includes(chat.id))USER_CHAT_IDS[id].push(chat.id);
   }
   for(const ev of batch.events||[]){
     for(const m of ev.messages||[]){
       if(GENERATED_APPLIED.has(m.id))continue;
       if(!CG[m.chat_id])continue;
       CG[m.chat_id].messages.push([m.day.slice(5),m.time,m.sender,m.text,m.id]);
       GENERATED_APPLIED.add(m.id);
     }
     for(const p of ev.posts||[]){
       if(GENERATED_APPLIED.has(p.id))continue;
       POSTS.push({id:p.id,by:p.author,at:`${p.day.slice(5)} ${p.time}`,txt:p.text,comments:[],like:'0'});
       GENERATED_APPLIED.add(p.id);
     }
   }
 }
 for(const chat of Object.values(CG))chat.messages.sort((a,b)=>a[0].localeCompare(b[0])||a[1].localeCompare(b[1]));
 if(S.day>WORLD.maxDay)S.day=WORLD.maxDay;
 WORLD.ready=true; WORLD.status='online';save();render();
}
async function apiFetch(path,options={}){
 const headers={...(options.headers||{}),'X-Game-Pin':apiPin};
 const res=await fetch(path,{...options,headers,cache:'no-store'});
 const payload=await res.json().catch(()=>({error:`服务端返回 HTTP ${res.status}`}));
 if(res.status===401){if(location.protocol==='https:'){location.replace('/login');throw Error('请重新登录')}showGate('PIN 尚未验证，或输入错误');throw Error('PIN 校验失败')}
 if(!res.ok)throw Error(payload.error||`请求失败（${res.status}）`);
 return payload;
}
function showGate(msg=''){$('gate').hidden=false;$('pin-error').textContent=msg;}
async function hydrate(){
 try{const data=await apiFetch('/api/state');applyWorld(data);$('gate').hidden=true;}
 catch(err){WORLD.ready=false;WORLD.status='error';console.info('World sync unavailable:',err.message);render()}
}
async function advanceDay(){
 if(WORLD.busy)return;
 if(S.day<WORLD.maxDay){S.day++;save();render();return;}
 if(!WORLD.ready){persistToast('请先连接到游戏后端');showGate('后端没有连接，或游戏 PIN 尚未验证');return}
 if(!WORLD.configured){persistToast('OpenAI API Key 尚未配置，请在 Mac 启动环境中设置');return}
 WORLD.busy=true;render();
 try{
  const expected=new Date(Date.UTC(2030,9,12+WORLD.maxDay)).toISOString().slice(0,10);
  const data=await apiFetch('/api/advance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expected_day:expected})});
  applyWorld(data);
  if(!data.cached) {S.day=WORLD.maxDay;save();}
  persistToast(data.cached?'已恢复现有历史，不重复生成':'新的一天已保存到世界账本');
 }catch(err){persistToast('生成失败：'+err.message);console.warn('World generation:',err.message);}
 finally{WORLD.busy=false;render()}
}
async function downloadBackup(){
 try{
  const data=await apiFetch('/api/backup');
  data.local_bookmarks=S.bookmarks;
  const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;a.download='镜头之外-世界事件备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);
  persistToast('世界账本已导出');
 }catch(err){persistToast('导出失败：'+err.message)}
}
let targetAvatar='';
function pickAvatar(id){targetAvatar=id;$('avatar-picker').click()}
$('avatar-picker').addEventListener('change',async e=>{
 const f=e.target.files?.[0];if(!f||!targetAvatar)return;
 try{
  if(!f.type.startsWith('image/'))throw Error('请选择图片');
  // iPhone originals are often too large. Create a 512px avatar crop locally; no face retouching.
  const bitmap=await createImageBitmap(f);
  const cv=document.createElement('canvas');cv.width=cv.height=512;
  const ctx=cv.getContext('2d');const side=Math.min(bitmap.width,bitmap.height);
  ctx.drawImage(bitmap,(bitmap.width-side)/2,(bitmap.height-side)/2,side,side,0,0,512,512);
  bitmap.close?.();
  const blob=await new Promise(resolve=>cv.toBlob(resolve,'image/jpeg',.9));
  const response=await apiFetch('/api/avatar',{method:'POST',headers:{'Content-Type':'image/jpeg','X-Person-Id':targetAvatar},body:blob});
  WORLD.avatars={...WORLD.avatars,...response.avatars};render();persistToast('头像已保存到游戏服务器');
 }catch(err){persistToast('上传失败：'+err.message)}
 finally{e.target.value='';targetAvatar=''}
});
$('pin-submit').addEventListener('click',async()=>{
 apiPin=$('pin-input').value.trim();try{sessionStorage.setItem('jtz-pin',apiPin)}catch{}
 $('pin-submit').disabled=true;
 try{await hydrate();if(!$('gate').hidden)$('pin-error').textContent='PIN 错误或后端未运行';}
 finally{$('pin-submit').disabled=false;}
});
$('pin-input').addEventListener('keydown',e=>{if(e.key==='Enter')$('pin-submit').click()});
render();hydrate();
</script>
